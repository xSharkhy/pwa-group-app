<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background circle with Mediterranean sun color -->
  <circle cx="50" cy="50" r="48" fill="#F4A261"/>

  <!-- Sun rays -->
  <g stroke="#FDF6EC" stroke-width="3" stroke-linecap="round">
    <line x1="50" y1="8" x2="50" y2="18"/>
    <line x1="50" y1="82" x2="50" y2="92"/>
    <line x1="8" y1="50" x2="18" y2="50"/>
    <line x1="82" y1="50" x2="92" y2="50"/>
    <line x1="20" y1="20" x2="27" y2="27"/>
    <line x1="73" y1="73" x2="80" y2="80"/>
    <line x1="20" y1="80" x2="27" y2="73"/>
    <line x1="73" y1="27" x2="80" y2="20"/>
  </g>

  <!-- Inner circle (sun face) -->
  <circle cx="50" cy="50" r="28" fill="#FCDBB7"/>

  <!-- Center dot -->
  <circle cx="50" cy="50" r="8" fill="#E76F51"/>
</svg>
